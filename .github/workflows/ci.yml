name: Maquette - parcours et responsive
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Campagne audit approfondie
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  maquette:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: lp-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntaxe et indépendance
        run: npm run check
      - name: Parcours API et permissions
        run: npm test
      - name: Vérifier l’expurgation des preuves
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Valider Compose
        run: docker compose config
      - name: Construire et démarrer les trois services
        run: docker compose up --build -d --wait
      - name: Vérifier les services et assets
        run: npm run smoke
      - name: Installer le navigateur de test
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Parcours UI et sept largeurs
        run: npx playwright test
      - name: Profils audit essentiels dans des instances indépendantes
        run: npx playwright test --config=playwright.audit.config.js --grep 'UI-AUD-0[1-4]'
      - name: Campagne audit approfondie à la demande
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        env:
          AUDIT_TRACE: '1'
        run: npx playwright test --config=playwright.audit.config.js
      - name: Inventorier et expurger les preuves
        id: evidence
        if: always()
        run: |
          node scripts/audit-evidence.mjs
          python scripts/sanitize-evidence.py
      - name: Journal des conteneurs
        if: always()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: preuves-maquette
          path: |
            test-results/
            playwright-report/
            audit-results/
          retention-days: 14
      - name: Arrêter les services de test
        if: always()
        run: docker compose down -v
