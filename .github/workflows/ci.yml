
name: Maquette - parcours et responsive

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Lancer la campagne d'audit approfondie
        type: boolean
        default: false
      strict_ui:
        description: Rendre les tests navigateur bloquants pour cette execution
        type: boolean
        default: false

permissions:
  contents: read

# Annuler uniquement les anciennes executions d'une meme PR.
concurrency:
  group: maquette-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maquette:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      CI: 'true'
      COMPOSE_PROJECT_NAME: lp-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparer Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # SOCLE OBLIGATOIRE
      - name: Syntaxe et independance
        id: check
        run: npm run check

      - name: Parcours API et permissions
        id: api
        run: npm test

      - name: Verifier l'expurgation des preuves
        id: redaction_tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # HANDOFF INFORMATIF PENDANT LA REFONTE
      - name: Valider le handoff UX/UI V3.2
        id: handoff
        continue-on-error: true
        run: python LOKASYON_PEYI_DESIGN_HANDOFF/tools/verify_v32.py

      # DOCKER ET SERVICES OBLIGATOIRES
      - name: Valider Docker Compose
        id: compose
        run: docker compose config

      - name: Construire et demarrer les trois services
        id: services
        run: docker compose up --build -d --wait

      - name: Verifier les services, routes et assets
        id: smoke
        run: npm run smoke

      # PLAYWRIGHT : VERSION COMPATIBLE AVEC LE DEPOT
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium

      # TESTS UI SOUPLES PAR DEFAUT
      - name: Parcours UI et sept largeurs
        id: ui
        timeout-minutes: 15
        continue-on-error: ${{ !(github.event_name == 'workflow_dispatch' && inputs.strict_ui) }}
        run: npx playwright test

      - name: Profils audit essentiels dans des instances independantes
        id: audit
        timeout-minutes: 12
        continue-on-error: ${{ !(github.event_name == 'workflow_dispatch' && inputs.strict_ui) }}
        run: npx playwright test --config=playwright.audit.config.js --grep 'UI-AUD-0[1-4]'

      # AUDIT COMPLET OPTIONNEL
      - name: Campagne audit approfondie a la demande
        id: extended
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        timeout-minutes: 20
        continue-on-error: ${{ !inputs.strict_ui }}
        env:
          AUDIT_TRACE: '1'
        run: npx playwright test --config=playwright.audit.config.js

      # SECURITE ET CONSERVATION DES PREUVES
      - name: Inventorier et expurger les preuves
        id: evidence
        if: always()
        continue-on-error: true
        run: |
          node scripts/audit-evidence.mjs
          python scripts/sanitize-evidence.py

      - name: Journal des conteneurs
        if: always()
        continue-on-error: true
        run: docker compose logs --no-color

      - name: Publier les preuves expurgees
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: preuves-maquette-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            audit-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Arreter et nettoyer les services de test
        if: always()
        continue-on-error: true
        run: docker compose down -v --remove-orphans

      # RAPPORT LISIBLE MEME SI LES TESTS SOUPLES ECHOUENT
      - name: Bilan de la CI
        if: always()
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
          API_RESULT: ${{ steps.api.outcome }}
          REDACTION_RESULT: ${{ steps.redaction_tests.outcome }}
          COMPOSE_RESULT: ${{ steps.compose.outcome }}
          SERVICES_RESULT: ${{ steps.services.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          HANDOFF_RESULT: ${{ steps.handoff.outcome }}
          UI_RESULT: ${{ steps.ui.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          EXTENDED_RESULT: ${{ steps.extended.outcome }}
          EVIDENCE_RESULT: ${{ steps.evidence.outcome }}
        run: |
          {
            echo '## Bilan Lokasyon Peyi - CI V3.2'
            echo ''
            echo '| Controle | Resultat | Mode |'
            echo '| --- | --- | --- |'
            echo "| Syntaxe et documentation | $CHECK_RESULT | Obligatoire |"
            echo "| API et permissions | $API_RESULT | Obligatoire |"
            echo "| Tests d'expurgation | $REDACTION_RESULT | Obligatoire |"
            echo "| Docker Compose | $COMPOSE_RESULT | Obligatoire |"
            echo "| Demarrage des services | $SERVICES_RESULT | Obligatoire |"
            echo "| Smoke | $SMOKE_RESULT | Obligatoire |"
            echo "| Handoff V3.2 | $HANDOFF_RESULT | Informatif |"
            echo "| Playwright UI | $UI_RESULT | Souple (strict sur demande) |"
            echo "| Audit essentiel | $AUDIT_RESULT | Souple (strict sur demande) |"
            echo "| Audit etendu | $EXTENDED_RESULT | A la demande |"
            echo "| Preuves expurgees | $EVIDENCE_RESULT | Informatif |"
            echo ''
            echo 'Un test souple en echec reste visible et documente ; il ne bloque pas une PR.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$HANDOFF_RESULT" == 'failure' || "$UI_RESULT" == 'failure' || "$AUDIT_RESULT" == 'failure' || "$EXTENDED_RESULT" == 'failure' || "$EVIDENCE_RESULT" == 'failure' ]]; then
            echo '::warning title=Controle informatif en echec::Lire le bilan et les preuves du workflow avant de fusionner.'
          fi
