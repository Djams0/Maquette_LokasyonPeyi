name: lokasyon-peyi-maquette
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - mock-data:/app/data
    networks: [maquette]
    restart: unless-stopped
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [maquette]
    restart: unless-stopped
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      api:
        condition: service_healthy
    networks: [maquette]
    restart: unless-stopped
networks:
  maquette:
    driver: bridge
volumes:
  mock-data:
